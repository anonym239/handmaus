name: Build HandMaus.exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --onefile --windowed --name HandMaus --add-data "hand_landmarker.task;." --add-data "anleitung.html;." --collect-all mediapipe handmaus.py
      - uses: actions/upload-artifact@v4
        with:
          name: HandMaus
          path: dist/HandMaus.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HandMaus.exe
